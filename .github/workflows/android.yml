name: Android checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check public files
        run: |
          python3 tools/test_check_public_files.py
          python3 tools/check_public_files.py
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
          dependency-graph: disabled
          build-scan-publish: false
          develocity-injection-enabled: false
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Install Android SDK
        run: |
          # 1. Locate the preinstalled tool without relying on the runner's PATH.
          task_sdkmanager="$(find "${ANDROID_HOME:?}/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$task_sdkmanager" && test -x "$task_sdkmanager"
          # 2. Install the project's pinned SDK packages.
          "$task_sdkmanager" 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Verify tests, lint, APK and unsigned bundle
        run: ./gradlew test lint assembleDebug assembleDebugAndroidTest bundleRelease --console=plain
      - name: Verify reproducible Room schema
        run: git diff --exit-code -- app/schemas
